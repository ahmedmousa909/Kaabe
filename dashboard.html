<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard — KAABE</title><link rel="stylesheet" href="auth.css"></head><body><main class="auth-shell"><a class="auth-brand" href="index.html"><img src="kaabe-logo.png" alt="KAABE"><b>KAABE</b></a><section class="auth-card"><h1>KAABE Dashboard</h1><p class="sub">Authentication is connected. Your business workspace comes next.</p><p id="user-email" class="user-email">Loading account…</p><div class="dashboard-actions"><button id="continue" type="button">Set up my business</button><button id="logout" class="secondary" type="button">Log out</button></div><div id="auth-message" class="message" role="status"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const client=window.kaabeSupabase;(async()=>{const{data}=await client.auth.getSession();if(!data.session){location.href="login.html";return}document.querySelector("#user-email").textContent=data.session.user.email;})();document.querySelector("#logout").addEventListener("click",async()=>{await client.auth.signOut();location.href="index.html"});document.querySelector("#continue").addEventListener("click",()=>{location.href="onboarding.html"});</script></body></html>
