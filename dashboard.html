<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dashboard — KAABE</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>
<main class="auth-shell">
  <a class="auth-brand" href="index.html">
    <img src="kaabe-logo.png" alt="KAABE"><b>KAABE</b>
  </a>

  <section class="auth-card">
    <h1>KAABE Dashboard</h1>
    <p id="dashboard-status" class="sub">Loading your workspace…</p>
    <p id="user-email" class="user-email"></p>

    <div id="business-info" style="display:none">
      <label>Your business</label>
      <h2 id="business-name" style="margin:8px 0 4px"></h2>
      <p id="business-meta" class="sub" style="margin-bottom:18px"></p>
    </div>

    <div class="dashboard-actions">
      <button id="primary-action" type="button" disabled>Loading…</button>
      <button id="logout" class="secondary" type="button">Log out</button>
    </div>

    <div id="auth-message" class="message" role="status"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
