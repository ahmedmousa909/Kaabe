<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KAABE AI Builder — Prototype</title><style>body{margin:0;background:#101827;color:#f8fafc;font:16px system-ui}main{max-width:900px;margin:auto;padding:32px 20px}h1{color:#fb923c}textarea,select{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;border:1px solid #475569;background:#1e293b;color:white}button{background:#f97316;color:white;border:0;border-radius:10px;padding:13px 20px;cursor:pointer}section{background:#1e293b;padding:22px;border-radius:18px;margin:20px 0}li{padding:8px}small{color:#cbd5e1}.warn{color:#fdba74}</style></head><body><main><h1>KAABE AI · Workflow Builder</h1><p>Describe your automation. This prototype offers safe template suggestions; real AI generation and external connections are not enabled yet.</p><section><label for="request">Your automation idea</label><textarea id="request" rows="5" placeholder="When someone messages my business on WhatsApp, draft a helpful reply..."></textarea><p><button id="suggest">Suggest workflow</button></p><p id="notice" aria-live="polite"></p></section><section><h2>Industry templates</h2><select id="templates" aria-label="Choose template"></select><p><button id="preview">Preview template</button></p></section><section><h2>Workflow preview</h2><ol id="steps"></ol><small class="warn">Preview only. No integrations are connected and no messages will be sent.</small></section></main><script type="module">import {templates} from "./templates.mjs";import {validateWorkflow} from "./engine.mjs";const list=document.querySelector("#templates");templates.forEach((t,i)=>list.add(new Option(t.name,String(i))));function show(t){const errors=validateWorkflow(t);document.querySelector("#steps").replaceChildren(...t.nodes.map(n=>{const li=document.createElement("li");li.textContent=n.type+" — "+n.id;return li}));document.querySelector("#notice").textContent=errors.length?errors.join("; "):"Draft preview: "+t.name;}document.querySelector("#preview").onclick=()=>show(templates[Number(list.value)]);document.querySelector("#suggest").onclick=()=>{const s=document.querySelector("#request").value.toLowerCase();const i=s.includes("whatsapp")?0:s.includes("sheet")||s.includes("gmail")?1:s.includes("telegram")?2:s.includes("appointment")||s.includes("ballan")?3:s.includes("airtable")||s.includes("lead")?4:-1;if(i<0){document.querySelector("#notice").textContent="I need more information. Select a template to preview. AI generation is not connected yet.";return;}list.value=String(i);show(templates[i]);};show(templates[0]);</script></body></html>
