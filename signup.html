<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account — KAABE</title><link rel="stylesheet" href="auth.css"></head><body><main class="auth-shell"><a class="auth-brand" href="index.html"><img src="kaabe-logo.png" alt="KAABE"><b>KAABE</b></a><section class="auth-card"><h1>Create your account</h1><p class="sub">Start building your AI workforce with KAABE.</p><form id="auth-form" data-mode="signup"><label for="full_name">Full name</label><input id="full_name" name="full_name" type="text" autocomplete="name" required><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required><button type="submit">Create Account</button><div id="auth-message" class="message" role="status"></div></form><p class="switch">Already have an account? <a href="login.html">Login</a></p><a class="back" href="index.html">← Back to home</a></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script></body></html>
