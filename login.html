<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login — KAABE</title><link rel="stylesheet" href="kaabe-app.css"></head>
<body class="login-page">
<main class="login-wrap">
  <a class="wordmark" href="index.html">KAABE</a>
  <section class="login-card">
    <h1>Welcome back</h1><p>Sign in to your account to continue</p>
    <form id="auth-form" data-mode="login">
      <label>Email address</label><input name="email" type="email" autocomplete="email" placeholder="Email address" required>
      <label>Password</label><input name="password" type="password" autocomplete="current-password" placeholder="Password" minlength="6" required>
      <div class="login-options"><span>KAABE AI Workforce</span><a href="#">Forgot password?</a></div>
      <button type="submit" class="primary">Sign In</button>
      <div id="auth-message" class="message" role="status"></div>
    </form>
    <p class="switch">Don’t have an account? <a href="signup.html">Create account</a></p>
    <a class="back-link" href="index.html">← Back to home</a>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script><script src="auth.js"></script>
</body></html>
